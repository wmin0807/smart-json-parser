<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Smart JSON Parser</title>
<style>
:root {
  color-scheme: dark;
  --bg: #10141d; --panel: #191e29; --inset: #141925; --raised: #232b39;
  --line: #343e50; --faint: #2a3344; --text: #eef2fa; --soft: #bac4d6; --muted: #9ba9c1;
  --accent: #a1bbff; --accent-ink: #111c36; --accent-soft: #263657;
  --key: #b4baff; --string: #9bd7f0; --number: #edbf84; --literal: #e1b4f7;
  --warn: #f4bd83; --error: #ffa6a0; --mark: #5c482a;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f9; --panel: #fff; --inset: #f8f9fc; --raised: #edf1f8;
  --line: #d6ddea; --faint: #e1e6ef; --text: #192235; --soft: #46546c; --muted: #52627b;
  --accent: #2b53bd; --accent-ink: #fff; --accent-soft: #e5ecff;
  --key: #4244ad; --string: #15627e; --number: #935011; --literal: #743ab0;
  --warn: #8f4e13; --error: #a82b28; --mark: #faeab8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled { opacity: .43; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.wrap { width: min(1440px, calc(100% - 80px)); margin-inline: auto; }
.top { flex: none; border-bottom: 1px solid var(--faint); background: var(--panel); }
.top-inner { min-height: 49px; display: flex; align-items: center; gap: 10px; }
.logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 17px/1 var(--mono); flex-shrink: 0; }
h1 { font-size: 1.13rem; line-height: 1.2; margin: 0; font-weight: 730; letter-spacing: -.035em; }
.settings { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.button, select {
  min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
  color: var(--soft); font-size: .875rem; white-space: nowrap;
}
.button:hover:not(:disabled), select:hover { background: var(--raised); color: var(--text); }
.button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.icon-button { min-width: 35px; padding-inline: 7px; }
main { padding: 11px 0 14px; }
.intro { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.intro > div:first-child { display: flex; align-items: baseline; gap: 12px; }
.intro h2 { margin: 0; font-weight: 700; font-size: 1rem; letter-spacing: -.015em; white-space: nowrap; }
.intro p { margin: 0; color: var(--muted); font-size: .84rem; }
.local { display: flex; align-items: center; gap: 7px; font-size: .84rem; color: var(--soft); white-space: nowrap; }
.local svg { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-bottom: 11px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
.stat > div { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.stat-label { color: var(--muted); font-size: .84rem; }
.stat strong { font: 600 1.08rem/1.25 var(--mono); font-variant-numeric: tabular-nums; }
.stat-icon { order: -1; color: var(--accent); background: var(--accent-soft); border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 auto; }
.stat-icon svg { width: .9rem; height: .9rem; }
.workbench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel-head { min-height: 58px; flex-wrap: wrap; gap: 8px; padding: 10px 13px; display: flex; align-items: center; justify-content: space-between; }
.heading { margin: 0; font-size: .99rem; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.heading svg { color: var(--accent); }
.actions, .result-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.primary, .primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 680; padding-inline: 12px; }
.primary:hover:not(:disabled) { filter: brightness(.92); }
.editor { margin: 0 10px; border: 1px solid var(--faint); border-radius: 8px; background: var(--inset); display: flex; flex: 1; min-height: 0; overflow: hidden; }
.gutter { flex: 0 0 auto; min-width: 36px; padding: 13px 8px; overflow: hidden; color: var(--muted); border-right: 1px solid var(--faint); text-align: right; user-select: none; }
.gutter, textarea, .tree, .compact { font: .855rem/1.67 var(--mono); tab-size: 2; }
textarea { border: 0; resize: none; min-width: 0; width: 100%; outline: none; padding: 13px 12px; background: transparent; }
textarea:focus-visible { outline: none; }
.editor:focus-within { border-color: var(--accent); }
textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
.input-foot { min-height: 47px; padding: 7px 12px; justify-content: space-between; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; }
.input-foot label { display: flex; align-items: center; gap: 7px; }
select { display: block; min-width: 0; max-width: 100%; appearance: none; padding-right: 25px; background: var(--inset); }
.select-box { position: relative; min-width: 0; }
.select-box::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; transform: translateY(-72%) rotate(45deg); border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); pointer-events: none; }
.input-foot select { min-height: 29px; padding-block: 2px; font-size: .79rem; }
.result-tools { margin: 0 10px; padding: 8px 0; border-top: 1px solid var(--faint); }
.result-tools .select-box { flex: 1 1 155px; }
.result-tools select { width: 100%; text-overflow: ellipsis; }
.search { flex: 1.25 1 170px; display: flex; position: relative; min-width: 0; align-items: center; color: var(--muted); }
.search svg { position: absolute; left: 9px; pointer-events: none; }
.search input { width: 100%; min-height: 34px; padding: 5px 25px 5px 32px; background: var(--inset); border: 1px solid var(--line); border-radius: 7px; font-size: .875rem; color: var(--text); }
.output { display: flex; flex: 1; flex-direction: column; min-height: 0; margin: 0 10px; background: var(--inset); border: 1px solid var(--faint); border-radius: 8px; overflow: hidden; }
.path { min-height: 41px; display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-bottom: 1px solid var(--faint); overflow-x: auto; white-space: nowrap; scrollbar-width: thin; font-size: .78rem; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 5px; font: 600 .72rem/1.45 system-ui, sans-serif; white-space: nowrap; color: var(--accent); background: var(--accent-soft); vertical-align: middle; }
.tree { min-height: 0; flex: 1; overflow: auto; padding: 9px 6px; }
.row { display: flex; align-items: baseline; min-height: 25px; padding: 1px 8px 1px 0;  margin-left: calc(var(--depth) * 16px); gap: 6px; width: max-content; min-width: calc(100% - var(--depth) * 16px); white-space: pre; border-radius: 4px; }
.row:hover { background: var(--raised); }
.row .content { white-space: pre; }
.node-toggle { align-self: flex-start; margin: 1px 0 0; background: transparent; width: 19px; height: 21px; border: 0; color: var(--muted); display: inline-grid; place-items: center; padding: 0; flex: 0 0 19px; }
.node-toggle::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); }
.node-toggle[aria-expanded="true"]::before { transform: rotate(45deg) translate(-1px, -1px); }
.node-spacer { width: 19px; flex: 0 0 19px; }
.key { color: var(--key); } .string { color: var(--string); } .number { color: var(--number); } .literal { color: var(--literal); }
.punctuation, .size { color: var(--muted); }
mark { background: var(--mark); color: var(--text); border-radius: 2px; }
.more { margin: 2px 0 2px calc(var(--depth) * 16px + 24px); }
.empty { height: 100%; min-height: 120px; display: grid; align-content: center; justify-items: center; text-align: center; gap: 7px; white-space: normal; color: var(--muted); font: .875rem/1.5 system-ui, sans-serif; padding: 16px; }
.empty svg { width: 28px; height: 28px; color: var(--accent); }
.empty strong { color: var(--text); font-size: 1rem; }
.compact { margin: 0; padding: 3px 7px; white-space: pre-wrap; overflow-wrap: anywhere; }
.result-foot { min-height: 47px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 7px 13px; font-size: .78rem; color: var(--muted); }
.state { min-width: 0; display: flex; align-items: center; gap: 7px; }
.state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 6px; }
.state[data-tone="good"] { color: var(--accent); }
.state[data-tone="warn"] { color: var(--warn); }
.state[data-tone="error"] { color: var(--error); }
.toast { position: fixed; right: 22px; bottom: 22px; padding: 9px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 20px #0004; font-size: .875rem; z-index: 5; }
[hidden] { display: none !important; }
@media (max-width: 1070px) { .button-label { display: none; } .wrap { width: calc(100% - 40px); } }
@media (max-width: 900px) { .intro p { display: none; } }
@media (min-width: 761px) {
  body { height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1; min-height: 540px; display: flex; flex-direction: column; }
  .intro, .stats { flex: none; }
  .workbench { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .wrap { width: calc(100% - 24px); }
  .workbench { grid-template-columns: minmax(0, 1fr); }
  .panel { height: min(75dvh, 640px); min-height: 405px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
}
@media (max-width: 425px) { .stat-icon { display: none; } }
@media (max-width: 360px) {
  .top-inner { gap: 7px; }
  h1 { font-size: 1rem; }
  .settings { gap: 5px; }
  .settings .button { padding-inline: 7px; }
}
</style>
</head>

    <div class="stat"><div><div class="stat-label" data-t="nested">嵌套展开</div><strong id="nested">—</strong></div><span class="stat-icon"><svg aria-hidden="true"><use href="#i-nest"/></svg></span></div>

          <button type="button" class="button icon-button" id="expand"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>

<script>
function parserWorker() {
  const MAX_INPUT = 1_000_000;
  const MAX_NODES = 100_000;
  const MAX_DEPTH = 150;
  const MAX_EXPANSIONS = 500;
  const LIMITS = { unwrap: 7, unescape: 7, url: 4, base64: 3, extract: 2 };
  const OWN = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const container = value => value !== null && typeof value === 'object';
  const numberPattern = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;
  const trim = value => value.trim().replace(/^\uFEFF/, '');
  const pointer = (path, key) => path + '/' + String(key).replace(/~/g, '~0').replace(/\//g, '~1');

  function strict(source) {
    try { return { value: JSON.parse(source) }; }
    catch { return null; }
  }

  // Parse permissive syntax directly, keeping comment and separator rules outside strings.
  function relaxed(source, java = false) {
    let at = 0;
    let nodes = 0;
    const invalid = () => { throw new SyntaxError(); };
    const space = /\s/;
    const literals = new Map([['true', true], ['false', false], ['null', null], ['none', null], ['non', null]]);
    const escaped = { '"': '"', "'": "'", '\\': '\\', '/': '/', b: '\b', f: '\f', n: '\n', r: '\r', t: '\t', v: '\v' };

    function skip() {
      while (at < source.length) {
        if (space.test(source[at])) { at++; continue; }
        if (java) return;
        if (source.startsWith('//', at) || source[at] === '#') {
          while (at < source.length && source[at] !== '\n' && source[at] !== '\r') at++;
        } else if (source.startsWith('/*', at)) {
          const end = source.indexOf('*/', at + 2);
          if (end < 0) invalid();
          at = end + 2;
        } else return;
      }
    }

    function quoted() {
      const quote = source[at++];
      let start = at;
      let value = '';
      while (at < source.length) {
        const character = source[at++];
        if (character === quote) return value + source.slice(start, at - 1);
        if (character !== '\\') continue;
        value += source.slice(start, at - 1);
        const symbol = source[at++];
        if (OWN(escaped, symbol)) value += escaped[symbol];
        else if (symbol === 'u' || symbol === 'x') {
          const width = symbol === 'u' ? 4 : 2;
          const digits = source.slice(at, at + width);
          if (digits.length !== width || !/^[\da-f]+$/i.test(digits)) invalid();
          value += String.fromCharCode(parseInt(digits, 16));
          at += width;
        } else if (symbol === '\n' || symbol === '\r') {
          if (symbol === '\r' && source[at] === '\n') at++;
        } else if (java && symbol !== undefined) value += '\\' + symbol;
        else invalid();
        start = at;
      }
      invalid();
    }

    function tokenForKey() {
      if (source[at] === '"' || source[at] === "'") return quoted();
      const start = at;
      if (java) {
        while (at < source.length && !/[={}\[\],]/.test(source[at])) at++;
      } else {
        while (at < source.length && !/[\s:{}\[\],#"'\\]/.test(source[at]) &&
               !source.startsWith('//', at) && !source.startsWith('/*', at)) at++;
      }
      const key = source.slice(start, at).trim();
      if (!key && !java) invalid();
      return key;
    }

    function read(depth) {

  const first = Math.floor(input.scrollTop / lineHeight);
  const visible = Math.min(Math.ceil(input.clientHeight / lineHeight) + 2, lineCount - first);
  const rows = element('div', '', Array.from({ length: Math.max(0, visible) }, (_, index) => first + index + 1).join('\n'));
  rows.style.whiteSpace = 'pre';
  rows.style.transform = 'translateY(' + (first * lineHeight - input.scrollTop) + 'px)';
  gutter.style.minWidth = Math.max(36, 18 + String(lineCount).length * 9) + 'px';
  gutter.replaceChildren(rows);
}

function updateLines() {
  const value = input.value;
  let at = -1;
  lineCount = 1;
  if (value.length <= 1_000_000) {
    while ((at = value.indexOf('\n', at + 1)) !== -1) lineCount++;
  }
  drawGutter();
}

function stopWorker() {
  clearTimeout(watchdog);
  if (worker) worker.terminate();
  worker = undefined;
}

function resetTree() {
  expandedMode = 'default';
  overrides = new Map();
  renderLimit = 850;
  searchCache = undefined;
  tree.scrollTo(0, 0);
}

function startParse() {
  clearTimeout(debounce);
  stopWorker();
  const source = input.value;
  result = null;
  selected = 0;
  resetTree();
  phase = !source.trim() ? 'idle' : 'working';
  render();
  if (phase === 'idle') return;
  if (source.length > 1_000_000) {
    phase = 'done';
    result = { candidates: [], tooLarge: true, elapsed: 0 };
    render();
    return;
  }
  const limit = Number($('timeout').value) * 1000;
  const finish = response => {
    stopWorker();
    phase = 'done';
    result = response;
    render();
  };
  try {
    worker = new Worker(workerUrl);
    worker.onmessage = event => finish(event.data);
    worker.onerror = () => finish({ candidates: [], workerError: true, elapsed: 0 });
    watchdog = setTimeout(() => finish({ candidates: [], timedOut: true, elapsed: limit }), limit);
    worker.postMessage({ source, deadline: Date.now() + limit - 100 });
  } catch {
    finish({ candidates: [], workerError: true, elapsed: 0 });
  }
}

function onInput() {
  clearTimeout(debounce);
  stopWorker();
  result = null;
  updateLines();
  phase = 'idle';
  if (input.value.trim()) {
    phase = 'working';
    debounce = setTimeout(startParse, 230);
  }
  render();
}

function renderPath(candidate) {
  const label = element('span', '', t.path);
  pathBar.replaceChildren(icon('path'), label);
  if (!candidate) { pathBar.append(element('span', '', '—')); return; }
  candidate.path.forEach((step, index) => {
    if (index) pathBar.append(element('span', '', '›'));
    pathBar.append(element('span', 'badge', t[step]));
  });
}

function statusInfo() {
  if (phase === 'idle') return ['idle', 'idleHint', ''];
  if (phase === 'working') return ['working', '', ''];
  if (result.tooLarge) return ['tooLarge', 'tooLargeHint', 'error'];
  if (result.workerError) return ['workerError', 'workerHint', 'error'];
  if (result.timedOut) return ['timeoutHit', 'timeoutHint', 'warn'];
  if (result.limited) return ['limited', 'tooLargeHint', 'warn'];
  if (!current()) return ['failed', 'failedHint', 'error'];
  return ['success', '', 'good'];
}

function render() {
  const candidate = current();
  $('fields').textContent = candidate ? formatter.format(candidate.stats.fields) : '—';
  $('leaves').textContent = candidate ? formatter.format(candidate.stats.leaves) : '—';
  $('nested').textContent = candidate ? formatter.format(candidate.nested) : '—';
  $('length').textContent = formatter.format(input.value.length);

  candidatesSelect.replaceChildren();
  candidatesSelect.disabled = !candidate;
  if (candidate) {
    result.candidates.forEach((item, index) => {
      const kind = Array.isArray(item.value) ? t.array : isContainer(item.value) ? t.object : t.scalar;
      const step = t[item.path.at(-1)];
      const option = element('option', '', t.candidate(index + 1, kind, step) + (index === 0 ? ' · ' + t.best : ''));
      option.value = index;
      candidatesSelect.append(option);
    });
    candidatesSelect.value = selected;
  } else candidatesSelect.append(element('option', '', t.noCandidates));

  for (const id of ['expand', 'collapse', 'copy', 'download', 'compact', 'search']) $(id).disabled = !candidate;
  $('compact').setAttribute('aria-pressed', String(compact));
  describe('compact', compact ? t.tree : t.compact);
  const status = statusInfo();
  $('status').textContent = t[status[0]];
  $('status').dataset.tone = status[2];
  $('details').textContent = result && !result.workerError && !result.tooLarge ?
    t.summary(result.candidates.length, result.elapsed) : '';
  renderPath(candidate);
  renderTree();
}

function emptyView(title, hint, glyph) {
  const empty = element('div', 'empty');
  empty.append(icon(glyph), element('strong', '', t[title]));
  if (hint) empty.append(element('span', '', t[hint]));
  tree.replaceChildren(empty);
}

function expression(query) {
  return new RegExp(query.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&'), 'giu');
}

function filtered(candidate, query) {
  if (searchCache?.candidate === candidate && searchCache.query === query) return searchCache;
  const matches = new Set();
  const ancestors = new Set();
  const pattern = expression(query);
  function test(value) {
    pattern.lastIndex = 0;
    return pattern.test(value);
  }
  function visit(value, key, path) {
    const nested = isContainer(value);
    const match = (key !== null && test(key)) || (!nested && test(String(value)));
    if (match) matches.add(path);
    let childMatch = false;
    if (nested) {
      const array = Array.isArray(value);
      for (const [name, child] of Object.entries(value)) {
        if (visit(child, array ? null : name, pointer(path, name))) childMatch = true;
      }
    }
    if (childMatch) ancestors.add(path);
    return match || childMatch;
  }
  visit(candidate.value, null, '');
  searchCache = { candidate, query, matches, ancestors };
  return searchCache;
}

function highlighted(node, value, pattern) {
  if (value.length > 1400) {
    if (pattern) pattern.lastIndex = 0;
    const match = pattern?.exec(value);
    const offset = Math.max(0, (match?.index ?? 0) - 500);
    const end = Math.min(value.length, Math.max(offset + 1400, (match?.index ?? 0) + (match?.[0].length ?? 0)));
    value = (offset ? '…' : '') + value.slice(offset, end) + (end < value.length ? '…' : '');
  }
  if (!pattern) { node.textContent = value; return; }
  pattern.lastIndex = 0;
  let start = 0;
  let match;
  for (let count = 0; count < 40 && (match = pattern.exec(value)); count++) {
    node.append(document.createTextNode(value.slice(start, match.index)), element('mark', '', match[0]));
    start = pattern.lastIndex;
  }
  node.append(document.createTextNode(value.slice(start)));
}

function renderTree(focusPath) {
  const candidate = current();
  if (!candidate) {
    const [status, hint] = statusInfo();
    emptyView(status, hint, status === 'working' ? 'path' : 'code');
    return;
  }
  const query = searchInput.value.trim();
  const filter = query ? filtered(candidate, query) : null;
  if (filter && !filter.matches.size) { emptyView('noMatch', 'noMatchHint', 'search'); return; }
  if (filter) $('details').textContent = t.hits(filter.matches.size) + ' · ' + t.summary(result.candidates.length, result.elapsed);
  if (compact && !filter) {
    tree.replaceChildren(element('pre', 'compact', JSON.stringify(candidate.value)));
    return;
  }

  const pattern = query ? expression(query) : null;
  const fragment = document.createDocumentFragment();
  const scroll = [tree.scrollLeft, tree.scrollTop];
  let rows = 0;
  let truncatedDepth;
  let toFocus;

  function row(depth, toggle, content, comma) {
    const line = element('div', 'row');
    line.style.setProperty('--depth', depth);
    line.append(toggle ?? element('span', 'node-spacer'), content);
    if (comma) line.append(element('span', 'punctuation', ','));
    fragment.append(line);
    rows++;
    return line;
  }

  function draw(value, key, path, depth, comma, inherited) {
    const hit = filter?.matches.has(path);
    const descendant = filter?.ancestors.has(path);
    if (filter && !inherited && !hit && !descendant) return;
    if (rows >= renderLimit) { truncatedDepth ??= depth; return; }
    const body = element('span', 'content');
    if (key !== null) {
      const label = element('span', 'key');
      highlighted(label, JSON.stringify(key), pattern);
      body.append(label, element('span', 'punctuation', ': '));
    }

    const nested = isContainer(value);
    const array = Array.isArray(value);
    const [open, close] = array ? ['[', ']'] : ['{', '}'];
    const entries = nested ? Object.entries(value) : [];
    const flexible = entries.length > 0;
    const unfolded = flexible && (overrides.get(path) ??
      (filter ? !!(descendant || hit || (inherited && depth < 2)) :
        expandedMode === 'all' || (expandedMode === 'default' && depth < 2)));

    if (!nested) {
      const type = typeof value;
      const token = element('span', type === 'string' ? 'string' : type === 'number' ? 'number' : 'literal');
      highlighted(token, JSON.stringify(value), pattern);
      body.append(token);
    } else {
      const display = !flexible ? open + close : (unfolded ? open : open + '…' + close);
      body.append(element('span', 'punctuation', display));
      if (flexible) body.append(element('span', 'size', '  ' + formatter.format(entries.length)));
    }

    let toggle;
    if (flexible) {
      toggle = element('button', 'node-toggle');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', String(unfolded));
      toggle.setAttribute('aria-label', (unfolded ? t.collapse : t.expand) + ' · ' + (key ?? (depth ? path.split('/').at(-1) : t.root)));
      toggle.dataset.path = path;
      if (focusPath === path) toFocus = toggle;
    }
    const line = row(depth, toggle, body, comma && !unfolded);
    if (Object.prototype.hasOwnProperty.call(candidate.badges, path)) {
      const steps = candidate.badges[path];
      const label = steps.find(step => ['base64', 'url', 'unescape', 'query', 'java', 'loose'].includes(step));
      const badge = element('span', 'badge', label ? t[label] : t.defaultBadge);
      badge.title = steps.map(step => t[step]).join(' › ');
      line.append(badge);
    }
    if (!unfolded) return;
    const showAll = inherited || hit;
    const shown = filter && !showAll ?
      entries.filter(([name]) => {
        const childPath = pointer(path, name);
        return filter.matches.has(childPath) || filter.ancestors.has(childPath);
      }) : entries;
    for (let index = 0; index < shown.length; index++) {
      if (rows >= renderLimit) { truncatedDepth ??= depth + 1; break; }
      const [name, child] = shown[index];
      draw(child, array ? null : name, pointer(path, name), depth + 1, index < shown.length - 1, showAll);
    }
    if (truncatedDepth === undefined) row(depth, null, element('span', 'punctuation', close), comma);
  }

  draw(candidate.value, null, '', 0, false, false);
  if (truncatedDepth !== undefined) {
    const more = element('button', 'button more', t.more);
    more.type = 'button';
    more.dataset.more = 'true';
    more.style.setProperty('--depth', Math.min(truncatedDepth, 10));
    fragment.append(more);
  }
  tree.replaceChildren(fragment);
  tree.scrollTo(...scroll);
  toFocus?.focus({ preventScroll: true });
}

function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
}

function outputText() {
  return JSON.stringify(current().value, null, compact ? 0 : 2);
}

$('sample').addEventListener('click', () => { input.value = sample; updateLines(); startParse(); });
$('clear').addEventListener('click', () => { input.value = ''; updateLines(); startParse(); input.focus(); });
$('parse').addEventListener('click', startParse);
$('timeout').addEventListener('change', startParse);
input.addEventListener('input', onInput);
input.addEventListener('scroll', drawGutter);
window.addEventListener('resize', drawGutter);
document.addEventListener('keydown', event => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
    event.preventDefault();
    startParse();
  }
});
$('language').addEventListener('click', () => {
  language = language === 'zh' ? 'en' : 'zh';
  remember('language', language);
  applySettings();
});
$('theme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  remember('theme', theme);
  applySettings();
});
candidatesSelect.addEventListener('change', () => {
  selected = Number(candidatesSelect.value);
  resetTree();
  render();
  candidatesSelect.focus();
});
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    overrides.clear();
    renderLimit = 850;
    tree.scrollTo(0, 0);
    render();
  }, 90);
});
tree.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.more) {
    renderLimit += 850;
    renderTree();
    return;
  }
  const path = button.dataset.path;
  if (path !== undefined) {
    overrides.set(path, button.getAttribute('aria-expanded') !== 'true');
    renderTree(path);
  }
});
for (const [id, mode] of [['expand', 'all'], ['collapse', 'none']]) {
  $(id).addEventListener('click', () => {
    expandedMode = mode;
    compact = false;
    overrides.clear();
    if (mode === 'none' && searchInput.value.trim()) overrides.set('', false);
    tree.scrollTo(0, 0);
    render();
  });
}
$('compact').addEventListener('click', () => {
  compact = !compact;
  if (compact) searchInput.value = '';
  tree.scrollTo(0, 0);
  render();
});
$('copy').addEventListener('click', async () => {
  const value = outputText();
  try {
    await navigator.clipboard.writeText(value);
    showToast(t.copied);
  } catch {
    const temporary = element('textarea');
    temporary.value = value;
    temporary.style.position = 'fixed';
    temporary.style.opacity = '0';
    document.body.append(temporary);
    temporary.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    temporary.remove();
    $('copy').focus();
    showToast(copied ? t.copied : t.copyError);
  }
});
$('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([outputText()], { type: 'application/json;charset=utf-8' }));
  const link = element('a');
  link.href = url;
  link.download = 'parsed.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(t.downloaded);
});

applySettings();
input.value = sample;
updateLines();
startParse();
</script>
</body>
</html>
